{% extends "base.html" %}

{% block content %}

<style>
    /* PAGE */
    .page {
        padding: 20px;
    }

    /* HEADER */
    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
    }

    .header h2 {
        margin: 0;
    }

    .subtitle {
        color: #6b7280;
        font-size: 14px;
    }

    /* BUTTON */
    .btn {
        background: #16a34a;
        color: white;
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
    }

    /* GRID */
    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
    }

    /* CARD */
    .card {
        background: #ffffff;
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        transition: 0.3s;
    }

    .card:hover {
        transform: translateY(-5px);
    }

    /* ICON */
    .icon {
        width: 50px;
        height: 50px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 10px;
        font-size: 20px;
    }

    .blue {
        background: #dbeafe;
        color: #2563eb;
    }

    .green {
        background: #dcfce7;
        color: #16a34a;
    }

    .pink {
        background: #ffe4e6;
        color: #e11d48;
    }

    /* TITLE */
    .title {
        font-weight: 600;
        margin-bottom: 5px;
    }

    /* LOCATION */
    .location {
        font-size: 13px;
        color: #6b7280;
    }

    /* VALUE BOX */
    .value-box {
        background: #f1f5f9;
        padding: 12px;
        border-radius: 12px;
        margin-top: 10px;
        font-size: 20px;
        font-weight: bold;
    }

    /* STATUS */
    .status {
        position: absolute;
        right: 15px;
        top: 15px;
        background: #dcfce7;
        color: green;
        padding: 5px 10px;
        border-radius: 20px;
        font-size: 12px;
    }

    /* MODAL */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
    }

    .modal-box {
        background: white;
        width: 520px;
        margin: 5% auto;
        padding: 20px;
        border-radius: 16px;
    }

    .form-grid {
        display: grid;
        gap: 12px;
        margin-top: 15px;
    }

    .form-grid input,
    .form-grid select {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid #ddd;
    }

    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 15px;
    }
</style>

<div class="page">

    <!-- HEADER -->
    <div class="header">
        <div>
            <h2>Data Sources</h2>
            <div class="subtitle">Manage environmental sensors and data feeds</div>
        </div>

        <button class="btn" onclick="openModal()">+ Add Source</button>
    </div>

    <!-- GRID -->
    <div class="grid">

        <!-- WEATHER -->
        <div class="card">
            <div class="status">active</div>

            <div class="icon pink">🌡</div>

            <div class="title">Weather Sensor</div>
            <div class="location">Live API</div>

            <div class="value-box" id="temp">--</div>
            <small id="humidity">--</small>
        </div>

        <!-- AQI -->
        <div class="card">
            <div class="status">active</div>

            <div class="icon blue">🌫</div>

            <div class="title">AQI Monitor</div>
            <div class="location">Air Quality Data</div>

            <div class="value-box" id="aqi">--</div>
            <small>PM2.5: <span id="pm25">--</span></small>
        </div>

        <!-- CLOUD -->
        <div class="card">
            <div class="status">active</div>

            <div class="icon green">☁️</div>

            <div class="title">Hybrid Cloud</div>
            <div class="location">Processing Engine</div>

            <div class="value-box">Active</div>
            <small>Edge + Cloud</small>
        </div>

    </div>

</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-box">

        <h3>New Data Source</h3>

        <div class="form-grid">
            <input placeholder="Sensor Name">
            <select>
                <option>Air Quality</option>
            </select>
            <select>
                <option>Hybrid</option>
            </select>
            <input placeholder="Location">
            <input placeholder="Latitude">
            <input placeholder="Longitude">
            <input placeholder="Unit">
            <input placeholder="Min Threshold">
            <input placeholder="Max Threshold">
            <input placeholder="Frequency">
        </div>

        <div class="modal-actions">
            <button onclick="closeModal()">Cancel</button>
            <button class="btn">Create</button>
        </div>

    </div>
</div>

<script>

    async function loadData() {
        let res = await fetch("/api/live-data?city=Hyderabad");
        let data = await res.json();

        let w = data.data.raw_data.weather;
        let a = data.data.raw_data.air_quality;

        temp.innerText = w.temperature + " °C";
        humidity.innerText = "Humidity: " + w.humidity + "%";

        aqi.innerText = a.aqi ?? "N/A";
        pm25.innerText = a.pm25 ?? "--";
    }

    function openModal() {
        modal.style.display = "block";
    }

    function closeModal() {
        modal.style.display = "none";
    }

    loadData();

</script>

{% endblock %}
